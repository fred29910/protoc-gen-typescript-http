version: 2

before:
  hooks:
    - go mod download

builds:
  - id: protoc-gen-typescript-http
    binary: protoc-gen-typescript-http
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ .Tag }}-next"

release:
  github:
    owner: go-kratos
    name: protoc-gen-typescript-http
  prerelease: auto
